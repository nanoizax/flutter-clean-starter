version: "3.9"

# PostgreSQL for backend API testing.
# Start with: docker compose up -d
# Connect: psql -h localhost -p 5432 -U starter -d starter_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: flutter_starter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_secret
      POSTGRES_DB: starter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
